name: RaisExample
options:
  bundleIdPrefix: app.rais
  deploymentTarget:
    iOS: "15.0"
packages:
  Rais:
    path: ..
targets:
  RaisExample:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Rais
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rais.example
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGNING_ALLOWED: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Raïs Example
        # The way back from the Raïs app (a payment's success_url / cancel_url can be raisexample://...)
        CFBundleURLTypes:
          - CFBundleURLName: app.rais.example
            CFBundleURLSchemes: [raisexample]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
